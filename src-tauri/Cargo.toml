[package]
name = "quota-otter"
version = "0.1.0"
description = "A little more headroom for your AI accounts"
authors = ["Quota Otter contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }
open = "5"
url = "2"
rfd = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
