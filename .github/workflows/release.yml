name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2t64
      - run: npm ci
      - run: node scripts/check-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installers
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
      - name: Collect release assets
        run: node scripts/collect-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify the complete artifact set and generate checksums
        run: node scripts/finalize-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Quota Otter $RELEASE_TAG" --notes-file RELEASE_NOTES.md
